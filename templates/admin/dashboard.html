{% extends "base.html" %}
{% block title %}Admin Dashboard - JM Souvenir{% endblock %}
{% block content %}
<div class="container-fluid py-3">

  <h3 class="fw-bold mb-4" style="font-family:'Playfair Display',serif;color:var(--primary-dark)">
    Admin Dashboard
  </h3>

  <div class="row g-3 mb-4">
    <div class="col-md-3 col-6">
      <div class="content-card text-center py-4">
        <div style="font-size:2.8rem;font-family:'Playfair Display',serif;font-weight:800;color:var(--accent)">
          {{ product_count }}
        </div>
        <div style="font-size:14px;color:var(--text-muted);margin-top:4px">Total Produk</div>
      </div>
    </div>
  </div>

  <a href="{{ url_for('admin.products') }}" class="btn btn-primary px-4" style="border-radius:20px;font-weight:700">
    <i class="fas fa-box me-2"></i>Kelola Produk
  </a>

</div>
{% endblock %}
