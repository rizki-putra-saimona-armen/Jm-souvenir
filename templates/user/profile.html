{% extends "base.html" %}
{% block title %}Profil Saya - JM Souvenir{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;margin:40px auto">
  <h4 class="fw-bold mb-4"><i class="fas fa-user me-2 text-warning"></i>Profil Saya</h4>
  <div class="card shadow-sm p-4">
    <form method="POST">
      <div class="text-center mb-4">
        <div style="width:80px;height:80px;border-radius:50%;background:#f5e6d3;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:2rem">
          <i class="fas fa-user text-warning"></i>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Nama Lengkap</label>
        <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" name="email" class="form-control" value="{{ current_user.email }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">No. HP</label>
        <input type="text" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
      </div>
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
        <a href="{{ url_for('user.orders') }}" class="btn btn-outline-secondary">Pesanan Saya</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
