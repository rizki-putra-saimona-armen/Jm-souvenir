{% extends "base.html" %}
{% block title %}Daftar - JM Souvenir{% endblock %}
{% block content %}
<div class="container" style="max-width:480px;margin:60px auto">
  <div class="card shadow-sm p-4">
    <div class="text-center mb-4">
      <i class="fas fa-trophy fa-2x text-warning"></i>
      <h4 class="fw-bold mt-2">Buat Akun Baru</h4>
      <p class="text-muted" style="font-size:13px">Sudah punya akun? <a href="{{ url_for('auth.login') }}">Masuk di sini</a></p>
    </div>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" name="username" class="form-control" placeholder="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Nama Lengkap</label>
        <input type="text" name="full_name" class="form-control" placeholder="Nama lengkap">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" name="email" class="form-control" placeholder="email@contoh.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">No. HP</label>
        <input type="text" name="phone" class="form-control" placeholder="08xxxxxxxxxx">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Min. 8 karakter" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Konfirmasi Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Ulangi password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold">Daftar Sekarang</button>
    </form>
  </div>
</div>
{% endblock %}
