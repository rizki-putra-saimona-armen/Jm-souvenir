{% extends "base.html" %}
{% block title %}Login - JM Souvenir{% endblock %}
{% block content %}
<div class="container" style="max-width:420px;margin:60px auto">
  <div class="card shadow-sm p-4">
    <div class="text-center mb-4">
      <i class="fas fa-trophy fa-2x text-warning"></i>
      <h4 class="fw-bold mt-2">Masuk ke JM Souvenir</h4>
      <p class="text-muted" style="font-size:13px">Belum punya akun? <a href="{{ url_for('auth.register') }}">Daftar sekarang</a></p>
    </div>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" name="email" class="form-control" placeholder="email@contoh.com" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="remember" id="remember">
          <label class="form-check-label" for="remember" style="font-size:13px">Ingat saya</label>
        </div>
        <a href="{{ url_for('auth.forgot_password') }}" style="font-size:13px">Lupa password?</a>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold">Masuk</button>
    </form>
  </div>
</div>
{% endblock %}
