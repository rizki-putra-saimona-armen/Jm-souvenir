{% extends "base.html" %}
{% block title %}Pengaturan - JM Souvenir{% endblock %}
{% block content %}
<div class="container" style="max-width:520px;margin:40px auto">
  <h4 class="fw-bold mb-4"><i class="fas fa-cog me-2 text-warning"></i>Pengaturan Akun</h4>
  <div class="card shadow-sm p-4">
    <h6 class="fw-bold mb-3">Ganti Password</h6>
    <form method="POST" action="{{ url_for('user.change_password') }}">
      <div class="mb-3">
        <label class="form-label">Password Lama</label>
        <input type="password" name="old_password" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password Baru</label>
        <input type="password" name="new_password" class="form-control" required>
      </div>
      <div class="mb-4">
        <label class="form-label">Konfirmasi Password Baru</label>
        <input type="password" name="confirm_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Simpan Password</button>
    </form>
  </div>
</div>
{% endblock %}
